plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
    id 'com.diffplug.spotless' version '8.7.0'
    id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}

apply plugin: 'kotlin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

mixin {
    add sourceSets.main, "sftcore.refmap.json"
    config "sftcore.mixins.json"
}

obfuscation {
    createRemappingConfiguration(configurations.runtimeClasspath)
}

legacyForge {
    version = "${mc_version}-${forge_version}"

    parchment {
        minecraftVersion = mc_version
        mappingsVersion = parchment_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        configureEach {
            sourceSet = sourceSets.main
            gameDirectory.set(file('run'))

            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }

        client {
            client()
            programArgument '--offline'
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = "gameTestServer"
        }

        data {
            data()
            gameDirectory.set(file('run-data'))

            programArguments.addAll('--mod', mod_id as String)
            programArguments.addAll('--all')
            programArguments.addAll('--output', file('src/generated/resources/').absolutePath)
            programArguments.addAll('--existing', file('src/main/resources/').absolutePath)
            programArguments.addAll('--existing-mod', 'gtceu')
            programArguments.addAll('--existing-mod', 'ae2')
            programArguments.addAll('--existing-mod', 'mekanism')
        }
    }
}

repositories {
    flatDir {
        dirs 'libs'
    }
    mavenCentral()
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven {
        name = "BMCLAPI"
        url = "https://bmclapi2.bangbang93.com/maven/"
    }
    maven {
        name = "KotlinForForge"
        url = "https://thedarkcolour.github.io/KotlinForForge/"
    }
    maven {
        // GregTech
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
            includeGroup 'brachy.modularui'
        }
    }
    maven {
        // JEI
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // EMI
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        // Registrate
        url = "https://maven.tterrag.com/"
    }
    maven {
        // Modrinth maven
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        // Curseforge maven
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        // Cloth Config API
        url = "https://maven.shedaniel.me/"
    }
    maven {
        // Jade
        url = "https://api.modrinth.com/maven"
    }
    maven {
        // Create, Ponder, Flywheel
        url = "https://maven.createmod.net"
    }
    maven {
        // ForgeConfigAPIPort
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        // GuideMe
        name = 'GuideME Snapshots'
        url = 'https://central.sonatype.com/repository/maven-snapshots/'
        content {
            includeModule('org.appliedenergistics', 'guideme')
        }
    }
    maven {
        // GeckoLib
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        // Extended Crafting
        url = 'https://maven.blakesmods.com'
    }
    maven {
        // LibX
        name = 'ModdingX Maven'
        url = 'https://maven.moddingx.org/'
    }
    maven {
        // Configuration
        name = 'Configuration'
        url = 'https://repo.repsy.io/mvn/toma/public/'
    }
    maven {
        // Curios API
        url = "https://maven.theillusivec4.top/"
    }
    mavenLocal()
}

dependencies {
    modImplementation "thedarkcolour:kotlinforforge:4.11.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${kotlin_version}"

    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}") { transitive = false }
    jarJar(modImplementation("brachy.modularui:modularui-mc1.20.1:${mui_version}") { transitive = false })
    modImplementation("com.gregtechceu.gtceu:gtceu-${mc_version}:${gtm_version}:slim") { transitive = false }
    modImplementation 'local:gtmoremachine-1.20.1:2.0.0:slim'
    modImplementation "mekanism:Mekanism:${mekanism_version}"
    modImplementation "mekanism:Mekanism:${mekanism_version}:generators"
    modImplementation "curse.maven:applied-mekanistics-574300:7244744"
    modImplementation "me.shedaniel.cloth:cloth-config-forge:11.1.136"
    modImplementation "curse.maven:mega-cells-622112:6175008"
    modImplementation("com.simibubi.create:create-${mc_version}:${create_version}:slim") { transitive = false }
    modImplementation "net.createmod.ponder:Ponder-Forge-${mc_version}:${ponder_version}"
    modImplementation "curse.maven:glodium-957920:5226922"
    modImplementation "org.appliedenergistics:guideme:${guideme_version}"
    modImplementation "appeng:appliedenergistics2-forge:${ae2_version}"
    modImplementation "mezz.jei:jei-${mc_version}-forge:${jei_version}"
    modImplementation "dev.emi:emi-forge:${emi_version}"
    modImplementation "curse.maven:ex-pattern-provider-892005:6677843"
    modImplementation "curse.maven:ae2addonlib-1366135:7159767"
    modImplementation "curse.maven:advancedae-1084104:7159779"
    modImplementation "software.bernie.geckolib:geckolib-forge-${mc_version}:${geckolib_version}"
    modImplementation "curse.maven:jade-324717:6855440"
    modImplementation "com.blakebr0.cucumber:Cucumber:${mc_version}-${cucumber_version}"
    modImplementation "com.blakebr0.extendedcrafting:ExtendedCrafting:${mc_version}-${extended_crafting_version}"
    modImplementation "curse.maven:travel-anchors-413234:4683662"
    modImplementation "curse.maven:carry-on-274259:4882500"
    modImplementation "org.moddingx:LibX:${mc_version}-${libx_version}"
    implementation("com.eliotlash.mclib:mclib:20")
    implementation annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0")
    jarJar(api("io.github.llamalad7:mixinextras-forge:0.5.0")).version {
        require("[0.2.0,)")
    }

    compileOnly 'org.projectlombok:lombok:1.18.30'
    compileOnly "net.neoforged:mergetool:2.0.3:api"
    modCompileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    modCompileOnly "dev.engine-room.flywheel:flywheel-forge-api-${mc_version}:${flywheel_version}"

    modImplementation("dev.toma.configuration:configuration-1.20.1:${configuration_version}-forge") { transitive = false }
    modRuntimeOnly "top.theillusivec4.curios:curios-forge:${curios_version}"
    modRuntimeOnly "dev.engine-room.flywheel:flywheel-forge-${mc_version}:${flywheel_version}"
    modRuntimeOnly "curse.maven:just-enough-characters-250702:6680042"
    modRuntimeOnly "maven.modrinth:jade:${jade_version}"
    modRuntimeOnly "curse.maven:architectury-api-419699:5137938"
    modRuntimeOnly "curse.maven:ftb-teams-forge-404468:6130786"
    modRuntimeOnly "curse.maven:ftb-library-forge-404465:6807424"

    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    annotationProcessor "org.moddingx:LibX:${mc_version}-${libx_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : mc_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching([
            'META-INF/mods.toml',
            'pack.mcmeta'
    ]) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs << "-Aquiet=true"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "MixinConfigs"            : "sftcore.mixins.json"])
    }
}

spotless {
    format 'misc', {
        target '.gitignore'

        trimTrailingWhitespace()
        endWithNewline()
    }

    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'

        def orderFile = file("$rootDir/gradle/spotless/spotless.importorder")
        def formatFile = file("$rootDir/gradle/spotless/spotless.eclipseformat.xml")

        toggleOffOn()
        importOrderFile(orderFile)
        removeUnusedImports('cleanthat-javaparser-unnecessaryimport')
        endWithNewline()
        eclipse('4.31').configFile(formatFile)
    }
}

kotlin {
    jvmToolchain(17)
}
